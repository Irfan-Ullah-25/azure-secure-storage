name: Terraform CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true

jobs:

  # --------------------------------
  # 1. Terraform Format
  # --------------------------------
  fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive


  # --------------------------------
  # 2. Terraform Validate
  # --------------------------------
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment:
          - dev
          - prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate


  # --------------------------------
  # 3. Security Scan
  # --------------------------------
  security:
    name: Checkov Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: true
          skip_check: CKV_AZURE_33,CKV_AZURE_59,CKV_AZURE_206,CKV2_AZURE_1

  # --------------------------------
  # 4. Terraform Plan
  # --------------------------------
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs:
      - fmt
      - validate
      - security

    strategy:
      matrix:
        environment:
          - dev
          - prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PR_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init

      - name: Terraform Plan
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform plan \
            -var-file=${{ matrix.environment }}.tfvars \
            -out=tfplan

      - name: Show Plan Summary
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform show -no-color tfplan > plan.txt

      - name: Publish Plan
        working-directory: environments/${{ matrix.environment }}
        run: |
          echo "## Terraform Plan - ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY


  # --------------------------------
  # 5. Terraform Apply
  # --------------------------------
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    # Apply only after merge/push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - plan

    # GitHub Environment should have required reviewer approval
    environment:
      name: production

    strategy:
      matrix:
        environment:
          - dev
          - prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init

      - name: Terraform Apply
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform apply \
            -auto-approve \
            -var-file=${{ matrix.environment }}.tfvars
