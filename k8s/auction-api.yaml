apiVersion: v1
kind: Namespace
metadata:
  name: auctions

---
apiVersion: v1
kind: Secret
metadata:
  name: auction-api-secret
  namespace: auctions
type: Opaque
stringData:
  db-password: "REPLACE_WITH_SECRET"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-api
  namespace: auctions
  labels:
    app: auction-api
spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: auction-api

  template:
    metadata:
      labels:
        app: auction-api

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: api

          # Use an immutable version instead of :latest
          image: democr.azurecr.io/auction-api:v1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auction-api-secret
                  key: db-password

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: auction-api
  namespace: auctions
spec:
  type: ClusterIP

  selector:
    app: auction-api

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auction-api-pdb
  namespace: auctions
spec:
  minAvailable: 2

  selector:
    matchLabels:
      app: auction-api

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auction-api-network-policy
  namespace: auctions
spec:
  podSelector:
    matchLabels:
      app: auction-api

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 8080
